services:
  api:
    build:
      context: .
      target: production
    ports:
      - '${PORT:-5000}:${PORT:-5000}'
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:${PORT:-5000}/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

